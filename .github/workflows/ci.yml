name: Verify and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: OAuth proxy tests
        run: npm run test:oauth
      - name: Content and compliance checks
        run: npm run verify
      - name: Build
        run: npm run build
